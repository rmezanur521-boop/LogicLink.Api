services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logiclink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - logiclink-pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=logiclink;Username=postgres;Password=postgres"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      - postgres

volumes:
  logiclink-pgdata: